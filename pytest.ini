[pytest]
testpaths = tests

#     .venv/bin/pytest -m "not lento and not caro"   # el ciclo rápido, ~2 s, en cada cambio
#     .venv/bin/pytest                               # completa, antes de cerrar un ticket
#
# Un test `lento` no es de segunda: para demostrar que el `statement_timeout`
# muerde hay que esperar los 15 segundos. Se marca para poder excluirlo sin
# excluir los de aislamiento, que tienen que sonar en cada cambio.
#
# Un test `caro` es el mismo criterio con otra unidad: no cuesta segundos,
# cuesta tokens de la API real del modelo. Son los que entran por
# `responder(...)`, y son los únicos del proyecto que le preguntan algo a un
# LLM. Se marcan aparte de `lento` porque se excluyen por razones distintas: uno
# para no esperar, el otro para no gastar.
markers =
    lento: espera a que el statement_timeout muerda de verdad; excluible con -m "not lento"
    caro: le pregunta al modelo y gasta tokens de la API real; excluible con -m "not caro"
